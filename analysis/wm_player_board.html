<title>WM 2026 -- Spieler-Impact-Board</title>
<style>
/* ==========================================================================
   Design-Tokens -- einzige Quelle fuer Farbe, Typo, Abstand, Radius, Schatten.
   Extrahiert aus analysis/wm_journey.py (Pokalkurs) und
   analysis/pool_review_render.py (Pool-Review). Herkunft je Zeile in
   analysis/ui_review.md, Abschnitt A1.

   Diese Datei wird auch von den Python-Generatoren gelesen und in deren
   Style-Block inlined -- die generierten Seiten bleiben dadurch
   self-contained: kein Stylesheet-Verweis, kein Netzzugriff. (Die Tag-Namen
   sind hier bewusst ausgeschrieben statt zitiert, sonst taucht ein
   scheinbarer externer Verweis in jedem erzeugten Artefakt auf.)
   ========================================================================== */

:root {
  /* --- Flaechen ------------------------------------------------------- */
  --bg: #fbfbfd;              /* wm_journey.py:715 */
  --bg2: #f1f1f4;             /* wm_journey.py:715 -- Rille, Chips, Code */
  --card: #ffffff;            /* wm_journey.py:715 */

  /* --- Text ----------------------------------------------------------- */
  --ink: #1d1d1f;             /* wm_journey.py:715 */
  --ink2: #3c3c43;            /* wm_journey.py:715 */
  --muted: #6e6e73;           /* wm_journey.py:715 */
  --faint: #a5a5ac;           /* wm_journey.py:715 */

  /* --- Linien --------------------------------------------------------- */
  --line: #e6e6ea;            /* wm_journey.py:716 */
  --line2: #efeff2;           /* wm_journey.py:716 -- innere Trenner */

  /* --- Akzent (F1: Pool-Review-Paar, Kontrast 5.31:1 fuer -deep) ------- */
  --acc: #059669;             /* pool_review_render.py:28 */
  --acc-d: #047857;           /* pool_review_render.py:29 -- Text/Links */
  --acc-soft: #e6f8ec;        /* wm_journey.py:717 */
  --acc-fill: rgba(5, 150, 105, 0.10);

  /* --- Semantikfarben, je Basis/soft/deep ----------------------------- */
  --blue: #007aff;   --blue-soft: #e6f0ff;   --blue-d: #0a62cc;   /* :718 */
  --amber: #ff9500;  --amber-soft: #fff1dc;  --amber-d: #a25e00;  /* :719 */
  --red: #ff3b30;    --red-soft: #ffe6e4;    --red-d: #bf271e;    /* :720 */
  --gold: #c39214;   --gold-soft: #faf1d6;                        /* :721 */

  /* --- Typografie ----------------------------------------------------- */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI", system-ui, Roboto, sans-serif;              /* :731 */
  --fs-base: 15px;            /* wm_journey.py:732 */
  --lh-base: 1.5;             /* wm_journey.py:732 */
  --track-tight: -0.022em;    /* wm_journey.py:735 */
  --track-tighter: -0.03em;   /* wm_journey.py:769 */
  --track-label: 0.06em;      /* pool_review_render.py:587 */

  /* --- Abstandsleiter (F4) -------------------------------------------- */
  /* Verdichtung der faktisch benutzten Werte, siehe ui_review.md F4.     */
  --s1: 4px;   --s2: 8px;   --s3: 12px;  --s4: 16px;
  --s5: 20px;  --s6: 26px;  --s7: 34px;  --s8: 56px;

  /* --- Radien --------------------------------------------------------- */
  --r1: 8px;                  /* Mikro: Score-Chip, Kbd */
  --r2: 13px;                 /* wm_journey.py:725 -- Kachel, Zeile */
  --r: 18px;                  /* wm_journey.py:725 -- Standardkarte */
  --r3: 22px;                 /* pool_review_render.py:633 -- Sektionskarte */
  --r-pill: 999px;            /* pool_review_render.py:573 */

  /* --- Schatten (Ruhe = sm, md nur bei Hover, lg nur bei Overlay) ------ */
  --sh-sm: 0 0.5px 1.5px rgba(0, 0, 0, 0.04),
           0 1px 2px rgba(0, 0, 0, 0.05);                         /* :722 */
  --sh: 0 1px 2px rgba(0, 0, 0, 0.04),
        0 8px 22px rgba(0, 0, 0, 0.06);                           /* :723 */
  --sh-lg: 0 2px 8px rgba(0, 0, 0, 0.05),
           0 22px 50px rgba(0, 0, 0, 0.1);                        /* :724 */

  /* --- Motion --------------------------------------------------------- */
  --t-fast: 0.15s;            /* wm_journey.py:856 */
  --t: 0.16s;                 /* wm_journey.py:748 */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);                         /* :752 */

  /* --- Layout --------------------------------------------------------- */
  --wrap: 1120px;             /* wm_journey.py:736 */
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.5;padding:28px 18px 60px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.03em}
/* ==========================================================================
   Spieler-Impact-Board -- helle Fassung auf den Dashboard-Tokens.

   Gescopt unter `.player-board`, und das ist wie beim Rival-Lab kein
   Schoenheitsgrund: das Board benutzt `.grid`, `.bar` und `.meta` --
   alle drei gibt es in assets/styles.css bereits mit anderer Bedeutung.

   Vorher war die Palette warmes Off-White mit Terracotta-Akzent und einem
   systemfremden Violett -- also die 2026-06-21 verworfene Editorial-Linie.
   Alle Werte kommen jetzt aus assets/tokens.css (T-0165). Die alten
   Hex-Werte sind hier bewusst nicht zitiert, sonst schlagen die
   Farb-Waechter in tests/test_dashboard_ui.py auf einen Kommentar an.
   ========================================================================== */

.player-board { color: var(--ink); }

.player-board .pb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: var(--s4);
}

.player-board .cd {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: var(--s5);
  box-shadow: var(--sh-sm);
}

.player-board .ct {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: var(--track-tight);
  margin: 0 0 2px;
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.player-board .cs {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0 0 var(--s3);
}

.player-board .r {
  padding: 9px 0;
  border-bottom: 1px solid var(--line2);
}

.player-board .r:last-child { border-bottom: 0; }

.player-board .rt {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s2);
}

.player-board .nm { font-size: 14.5px; font-weight: 600; }

.player-board .tm {
  font-size: 12px;
  color: var(--muted);
  margin-left: 7px;
  font-weight: 400;
}

.player-board .v {
  font-size: 14.5px;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.player-board .su { font-size: 11.5px; color: var(--muted); font-weight: 400; }

.player-board .pb-bar {
  height: 5px;
  background: var(--bg2);
  border-radius: 3px;
  margin-top: 7px;
  overflow: hidden;
}

.player-board .pb-bar i { display: block; height: 100%; border-radius: 3px; }

.player-board .pb-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.player-board .pill {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}

.player-board .pill--gedeckt { background: var(--acc-soft); color: var(--acc-d); }
.player-board .pill--heiss { background: var(--red-soft); color: var(--red-d); }
.player-board .pill--kalt { background: var(--blue-soft); color: var(--blue-d); }

.player-board .mis {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: var(--s4) var(--s5);
  margin-top: var(--s4);
  box-shadow: var(--sh-sm);
}

.player-board .mp {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  background: var(--red-soft);
  color: var(--red-d);
  border-radius: var(--r1);
  padding: 4px 11px;
  margin: var(--s1) 5px 0 0;
}

.player-board .foot {
  color: var(--muted);
  font-size: 12px;
  margin-top: var(--s6);
  line-height: 1.6;
}

</style></head><body><div class="wrap">
<h1>WM 2026 &mdash; Spieler-Impact-Board</h1>
<div class="player-board" id="board"></div>
</div>
<script>
// Spieler-Impact-Board -- Render-Logik, geteilt zwischen zwei Zielen:
//   1. analysis/wm_player_board.html (standalone, von
//      analysis/wm_player_ratings.py erzeugt; CSS und JS werden dort inline
//      eingebettet, damit die Datei ohne Server und ohne Netz laeuft)
//   2. Dashboard-Tab "Analyse" (assets/app.js ruft mountPlayerBoard)
// Die Datei ist die EINZIGE Quelle dieser Logik -- nicht kopieren (T-0165).
//
// Balkenfarben: Werte aus assets/tokens.css, literal notiert weil sie als
// style-Attribut gesetzt werden. Vorher standen hier ein Terracotta- und
// ein systemfremder Violett-Ton (Hex-Werte bewusst nicht zitiert, sonst
// schlagen die Farb-Waechter in tests/test_dashboard_ui.py darauf an).
function mountPlayerBoard(DATA, host) {
  const ziel = host || document.getElementById("analyse-player-board");
  if (!ziel) return;

  const BALKEN = {
    finisher: "#047857",  // --acc-d
    keeper: "#0a62cc",    // --blue-d
    kreator: "#a25e00",   // --amber-d
    hot: "#c39214",       // --gold
  };

  const esc = (wert) => String(wert ?? "").replace(/[&<>"']/g, (z) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[z]);

  const balken = (anteilProzent, farbe) =>
    `<div class="pb-bar"><i style="width:${Math.max(0, Math.min(100, anteilProzent)).toFixed(0)}%;background:${farbe}"></i></div>`;

  // Die drei Tags kommen aus wm_player_ratings.club_tag().
  const tagPille = (tag, verhaeltnis) => {
    if (!tag) return "";
    return `<span class="pill pill--${esc(tag)}">${esc(tag)} · ${esc(verhaeltnis)}× Club</span>`;
  };

  const zeile = (titel, zusatz, wert, einheit, breite, farbe, meta) => `
    <div class="r">
      <div class="rt">
        <span class="nm">${esc(titel)}<span class="tm">${esc(zusatz)}</span></span>
        <span class="v">${wert}${einheit ? `<span class="su"> ${esc(einheit)}</span>` : ""}</span>
      </div>
      ${breite === null ? "" : balken(breite, farbe)}
      ${meta ? `<div class="pb-meta">${meta}</div>` : ""}
    </div>`;

  const finisher = (DATA.finishers || []).slice(0, 12).map((p) => zeile(
    p.name, p.team, esc(Number(p.talent90).toFixed(2)), "G+A/90",
    p.talent90 / 1.55 * 100, BALKEN.finisher,
    `${esc(p.G)}G ${esc(p.A)}A · ${esc(p.min)}min ${tagPille(p.club_tag, p.club_ratio)}`
  )).join("");

  // keepers kommen als Tupel (prev, name, team, sota, ga, cs).
  const keeper = (DATA.keepers || []).slice(0, 6).map((k) => {
    const [prev, name, team, sota, ga, cs] = k;
    return zeile(
      name, team, `+${Number(prev).toFixed(2)}`, "",
      prev / 3.4 * 100, BALKEN.keeper,
      `${esc(sota)} Schuesse aufs Tor, ${esc(ga)} kassiert · ${esc(cs)}× zu Null`
    );
  }).join("");

  const kreatoren = (DATA.creators || []).slice(0, 5).map((p) => zeile(
    p.name, p.team, esc(p.A), "Assists",
    p.A / 3 * 100, BALKEN.kreator, `${esc(p.G)} eigene Tore`
  )).join("");

  const hot = (DATA.hot || []).slice(0, 5).map((p) => zeile(
    p.name, `${p.min}min`, `<span class="su">${esc(p.raw90)} &rarr; ${esc(p.talent90)}</span>`,
    "", p.heat / 1.2 * 100, BALKEN.hot, ""
  )).join("");

  const kalt = (DATA.cold || []).slice(0, 5).map((p) => zeile(
    p.name, p.team, `<span class="su">${esc(p.talent90)} vs ${esc(p.club_xga90)}</span>`,
    "", null, "", ""
  )).join("");

  const stumm = (DATA.misfiring || [])
    .map((eintrag) => `<span class="mp">${esc(eintrag[0])} · 0</span>`).join("");

  const fortschritt = DATA.played == null || DATA.total == null
    ? "Turnierstand unbekannt"
    : `Turnier ${esc(DATA.played)}/${esc(DATA.total)} Spiele`;

  ziel.innerHTML = `
    <p class="cs">${fortschritt} · Spielerdaten Stand ${esc(DATA.daten_stand)} ·
       freie Zaehldaten (FBref) + Club-xG (Understat 25/26) · Empirical-Bayes-geglaettet</p>
    <div class="pb-grid">
      <div class="cd">
        <p class="ct">&#127919; Finisher &mdash; Talent-Rate</p>
        <p class="cs">G+A/90 gegen Minuten geschrumpft; Tag = WM vs Club-xGA90</p>${finisher}
      </div>
      <div class="cd">
        <p class="ct">&#129508; Torhüter &mdash; Goals Prevented</p>
        <p class="cs">verhinderte Tore gegenüber Schnitt, schussvolumen-bereinigt</p>${keeper}
      </div>
      <div class="cd">
        <p class="ct">&#128095; Kreatoren &mdash; Vorlagen</p>
        <p class="cs">Wert aus dem Auflegen, nicht dem Toreschießen</p>${kreatoren}
      </div>
      <div class="cd">
        <p class="ct">&#128293; Hot-Streak &mdash; Regression</p>
        <p class="cs">rohe Rate » Talent bei kleiner Stichprobe → kühlt ab</p>${hot}
        <p class="cs" style="margin:14px 0 6px">Kalt &mdash; Elite unter Club-Niveau, Aufwärts-Potenzial:</p>${kalt}
      </div>
    </div>
    <div class="mis">
      <p class="ct" style="font-size:15px">&#9888;&#65039; Angriff streikt &mdash; Predictions-Watch</p>
      <p class="cs">0 Spieler-Tore in der Gruppenphase &mdash; bei hoher Modell-Stärke Übertippen-Gefahr</p>${stumm}
    </div>
    <p class="foot">Methodik: rohe Per-90-Raten bei 90&ndash;180 Min sind verrauscht →
      Empirical-Bayes-Shrinkage gegen einen Prior (0,45 G+A/90, Stärke 2 Spiele).
      Club-xGA90 = (xG+xA)/90 der Vereinssaison 25/26, direkt vergleichbar.
      „heiss" = WM über Club (Regression wahrscheinlich), „kalt" = unter Club (Potenzial).
      Keeper: verhinderte Tore = Schussvolumen × Liga-Gegentorquote − tatsächliche Gegentore.
      Kein Modell-/Tipp-Input &mdash; rein deskriptiv.</p>`;
}
